<!DOCTYPE html>
<!--
  Round-2 design mockups (2026-10-01), not shipped. Self-contained: these use their own "legible size"
  styles rather than the shipped popup.css, because the size itself is one of the proposals.

  Variants (?variant=…): c2 c1 p1 p2 p3 i2 i3 micro.  Base = player C2 + physics P1 + no icons.
  tools/mockshot.mjs --page round2.html renders each to docs/mockups/r2-<variant>.png.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Round 2 mockups</title>
  <style>
    :root {
      --bg: #121216; --bg2: #18181f; --surface: #1e1e26; --card: rgba(255,255,255,0.03);
      --accent: #00e5ff; --glow: rgba(0,229,255,0.35); --text: #fff; --muted: #9a9aa5; --line: rgba(255,255,255,0.08);
      --cover: radial-gradient(circle at 30% 28%, #ffd166 0, #ef476f 32%, #4b1d6e 68%, #0b0b16 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html { background: #2a2a2e; }
    body { padding: 18px; color: var(--text); font-size: 12.5px; }
    .switcher { font-size: 12px; color: #ccc; margin-bottom: 12px; display: flex; gap: 10px; }
    .switcher a { color: #7fe8ff; } .switcher a.on { color: #fff; font-weight: 700; text-decoration: none; }
    .caption { font-size: 11px; color: #aaa; margin-top: 8px; width: 440px; }

    /* ---------- popup frame ---------- */
    .shot { width: 440px; background: var(--bg); border-radius: 6px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.6); position: relative; }
    .row { display: flex; align-items: stretch; }
    .art { width: 56px; flex: 0 0 56px; position: relative; overflow: hidden; background: #0e0e12; border-right: 1px solid rgba(255,255,255,0.06); }
    .art .bg { position: absolute; inset: -20px; background: var(--cover); background-size: cover; filter: blur(16px) saturate(1.2) brightness(0.42); }
    .art .cover { position: relative; width: 56px; height: 56px; background: var(--cover); background-size: cover; box-shadow: 0 3px 10px rgba(0,0,0,0.6); }
    .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    /* ---------- player (option C, legible) ---------- */
    .np { padding: 10px 12px 8px; background: linear-gradient(180deg, var(--surface) 0%, var(--bg2) 100%); border-bottom: 1px solid var(--line); }
    .np .title { font-size: 16px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np .artist { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np .artist b { color: var(--text); font-weight: 600; }
    .transport { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .transport.inline { margin-top: 0; gap: 2px; }
    .tbtn { background: none; border: none; color: var(--text); cursor: pointer; width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
    .tbtn:hover { background: rgba(255,255,255,0.08); }
    .tbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tbtn.small svg { width: 16px; height: 16px; }
    .tbtn.play { width: 40px; height: 40px; background: var(--accent); color: #000; }
    .tbtn.play svg { fill: #000; stroke: none; width: 18px; height: 18px; }
    .tbtn.jump { position: relative; width: 40px; height: 36px; }
    .tbtn.jump svg { width: 26px; height: 26px; }
    .tbtn.jump span { position: absolute; font-size: 8px; font-weight: 800; top: 13px; left: 0; right: 0; text-align: center; letter-spacing: -0.2px; }
    .tbtn.heart.on svg { fill: #fff; stroke: #fff; }
    .inline .tbtn { width: 28px; height: 28px; } .inline .tbtn svg { width: 16px; height: 16px; }
    .inline .tbtn.play { width: 32px; height: 32px; } .inline .tbtn.jump { width: 32px; } .inline .tbtn.jump span { top: 10px; font-size: 7px; }
    .np-inline { display: flex; align-items: center; gap: 8px; }
    .np-inline .text { flex: 1; min-width: 0; }
    .progress { height: 2px; background: #2a2a35; margin: 8px -12px -8px; } .progress > div { height: 100%; background: var(--accent); width: 28%; }

    /* ---------- EQ status row ---------- */
    .status { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .status .lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.8px; color: var(--muted); }
    .switch { position: relative; display: inline-block; width: 38px; height: 21px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .knob { position: absolute; inset: 0; background: #333; border-radius: 20px; cursor: pointer; transition: .2s; }
    .knob:before { content: ""; position: absolute; height: 17px; width: 17px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: .2s; }
    input:checked + .knob { background: var(--accent); } input:checked + .knob:before { transform: translateX(17px); background: #000; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 12px; }
    .badge.on { background: var(--glow); color: var(--accent); border: 1px solid var(--accent); }

    /* ---------- presets + sliders (legible size) ---------- */
    .eq { padding: 10px 12px 6px; display: flex; flex-direction: column; gap: 9px; }
    .presets { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .presets .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; height: 20px; }
    .presets .t { font-size: 11px; font-weight: 800; letter-spacing: 0.6px; color: var(--muted); }
    .presets .pill { font-size: 10px; font-weight: 700; color: #999; background: rgba(255,255,255,0.06); padding: 2px 7px; border-radius: 9px; margin-left: 6px; min-width: 64px; display: inline-block; text-align: center; }
    .presets .acts { display: flex; gap: 10px; } .presets .acts span { color: var(--accent); font-size: 11.5px; font-weight: 600; }
    .select { width: 100%; padding: 6px 9px; background: var(--surface); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; font-size: 13px; display: flex; justify-content: space-between; }
    .eqrow { display: flex; align-items: center; gap: 8px; }
    .eqrow .label { width: 138px; flex-shrink: 0; font-size: 12.5px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
    .eqrow .label small { color: var(--muted); font-size: 10.5px; font-weight: 400; }
    .nudge { width: 20px; height: 20px; border-radius: 4px; background: var(--surface); border: 1px solid rgba(255,255,255,0.12); color: #aaa; font-size: 13px; line-height: 18px; text-align: center; flex-shrink: 0; }
    .track { flex: 1; height: 6px; border-radius: 3px; background: #2a2a35; position: relative; }
    .track i { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); }
    .val { width: 62px; text-align: right; font-size: 12.5px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
    .toggle { display: flex; justify-content: space-between; align-items: center; }

    /* icon variants */
    .ic { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: #8d8d99; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .ic.on { stroke: var(--accent); }
    .tag { font-size: 9px; font-weight: 800; letter-spacing: 0.5px; color: #b9b9c6; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; padding: 2px 5px; min-width: 34px; text-align: center; flex-shrink: 0; }
    .tag.on { color: var(--accent); border-color: rgba(0,229,255,0.4); background: rgba(0,229,255,0.08); }

    /* ---------- physics, integrated into the main screen ---------- */
    .phys { background: #0c0c10; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .phys .hdr { display: flex; justify-content: space-between; align-items: center; padding: 5px 9px 0; }
    .phys .hdr span { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; color: var(--muted); }
    .phys .hdr em { font-style: normal; font-size: 10px; color: var(--muted); }
    .phys svg { display: block; width: 100%; }
    .phys .curve path.c { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; filter: drop-shadow(0 0 4px var(--glow)); }
    .phys .curve path.fill { fill: url(#cfill); stroke: none; }
    .phys .curve line { stroke: rgba(255,255,255,0.12); stroke-width: 1; }
    .phys .curve text { fill: #666; font-size: 8.5px; }
    .phys .wave path { fill: none; stroke: var(--accent); stroke-width: 2; filter: drop-shadow(0 0 5px var(--glow)); }
    .phys .wave line { stroke: rgba(255,255,255,0.08); stroke-dasharray: 3 3; }
    .phys .wave text { fill: #777; font-size: 8px; }
    .stages { display: flex; gap: 4px; padding: 6px 8px 8px; }
    .stage { flex: 1; font-size: 9.5px; font-weight: 700; text-align: center; padding: 3px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); color: var(--muted); background: rgba(255,255,255,0.03); white-space: nowrap; }
    .stage.on { color: var(--accent); border-color: rgba(0,229,255,0.5); background: rgba(0,229,255,0.08); }
    .stage.fixed { color: #666; border-style: dashed; }

    /* ---------- footer row (replaces the header) ---------- */
    .foot { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--bg2); }
    .foot .opt { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .foot .opt b { color: var(--text); font-weight: 600; }
    .dots { display: flex; gap: 7px; align-items: center; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .dots i.sel { box-shadow: 0 0 0 2px var(--bg2), 0 0 0 3.5px #fff; }
    .link { font-size: 12px; color: var(--accent); font-weight: 600; }

    /* ---------- always-on-top mini bar (Document PiP) ---------- */
    .micro { width: 480px; height: 66px; background: var(--bg); border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 0; box-shadow: 0 12px 40px rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
    .micro .mart { width: 66px; height: 66px; background: var(--cover); background-size: cover; flex-shrink: 0; margin-right: 4px; }
    .micro .mtext { flex: 1; min-width: 0; }
    .micro .mtext .title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .micro .mtext .artist { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .micro .tbtn { width: 28px; height: 28px; } .micro .tbtn svg { width: 16px; height: 16px; }
    .micro .tbtn.play { width: 32px; height: 32px; } .micro .tbtn.jump { width: 30px; } .micro .tbtn.jump span { top: 10px; font-size: 7px; }
    .micro .eqpill { font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 10px; background: var(--glow); color: var(--accent); border: 1px solid var(--accent); white-space: nowrap; }
    .micro .x { color: var(--muted); font-size: 14px; margin-left: 2px; }
  </style>
</head>
<body>
  <div class="switcher" id="switcher"></div>
  <div id="root"></div>
  <div class="caption" id="caption"></div>

  <!-- SVG symbols: monoline, no emoji -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="cfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity="0.22"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient>
    </defs>
    <symbol id="s-heart" viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9A5.2 5.2 0 0 1 12 6.2 5.2 5.2 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></symbol>
    <symbol id="s-prev" viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M18 5 8 12l10 7z"/></symbol>
    <symbol id="s-next" viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M6 5l10 7-10 7z"/></symbol>
    <symbol id="s-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
    <symbol id="s-back" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 3v5h5"/></symbol>
    <symbol id="s-fwd" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v5h-5"/></symbol>
    <symbol id="i-bass" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="2.2"/></symbol>
    <symbol id="i-hpf" viewBox="0 0 16 16"><path d="M2 13.5C5.5 13.5 6 3 14 3"/><path d="M2 3v10.5"/></symbol>
    <symbol id="i-mid" viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5"/></symbol>
    <symbol id="i-high" viewBox="0 0 16 16"><path d="M8 1.5 9.6 6.4 14.5 8 9.6 9.6 8 14.5 6.4 9.6 1.5 8l4.9-1.6z"/></symbol>
    <symbol id="i-auto" viewBox="0 0 16 16"><path d="M8 2v12M3 5.5h10"/><path d="M3 5.5 1.5 10h3zM13 5.5l-1.5 4.5h3z"/></symbol>
    <symbol id="i-vol" viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.5 6a3 3 0 0 1 0 4"/></symbol>
    <symbol id="i-speed" viewBox="0 0 16 16"><path d="M2.5 12.5a6 6 0 1 1 11 0"/><path d="M8 12.5l3-4.5"/></symbol>
  </svg>

  <!-- ===== Player C2 (recommended): title, then a transport row ===== -->
  <template id="player-c2">
    <div class="np">
      <div class="title">Innerbloom (What So Not Remix)</div>
      <div class="artist"><b>RÜFÜS DU SOL</b> · 2015 · 2:41 / 9:38</div>
      <div class="transport">
        <button class="tbtn heart" title="Add to / remove from My Collection"><svg><use href="#s-heart"/></svg></button>
        <button class="tbtn small" title="Previous track"><svg><use href="#s-prev"/></svg></button>
        <button class="tbtn jump" title="Back 15 seconds"><svg><use href="#s-back"/></svg><span>15</span></button>
        <button class="tbtn play" title="Pause"><svg><use href="#s-pause"/></svg></button>
        <button class="tbtn jump" title="Forward 30 seconds"><svg><use href="#s-fwd"/></svg><span>30</span></button>
        <button class="tbtn small" title="Next track"><svg><use href="#s-next"/></svg></button>
      </div>
      <div class="progress"><div></div></div>
    </div>
  </template>

  <!-- ===== Player C1: transport inline with the title ===== -->
  <template id="player-c1">
    <div class="np">
      <div class="np-inline">
        <div class="text">
          <div class="title">Innerbloom (What So Not Remix)</div>
          <div class="artist"><b>RÜFÜS DU SOL</b> · 2015 · 2:41 / 9:38</div>
        </div>
        <div class="transport inline">
          <button class="tbtn heart"><svg><use href="#s-heart"/></svg></button>
          <button class="tbtn jump"><svg><use href="#s-back"/></svg><span>15</span></button>
          <button class="tbtn play"><svg><use href="#s-pause"/></svg></button>
          <button class="tbtn jump"><svg><use href="#s-fwd"/></svg><span>30</span></button>
        </div>
      </div>
      <div class="progress"><div></div></div>
    </div>
  </template>

  <template id="status">
    <div class="status">
      <span class="lbl">AUDIO EQ</span>
      <label class="switch"><input type="checkbox" checked><span class="knob"></span></label>
      <span class="badge on">● ON · Tidal</span>
    </div>
  </template>

  <template id="presets">
    <div class="presets">
      <div class="head">
        <div><span class="t">PRESETS</span><span class="pill">● Saved</span></div>
        <div class="acts"><span>+ Save</span><span>↺ Reset</span></div>
      </div>
      <div class="select"><span>Punchy Bass & Clarity</span><span>▾</span></div>
    </div>
  </template>

  <!-- Physics P1: response curve only -->
  <template id="phys-p1">
    <div class="phys">
      <div class="hdr"><span>RESPONSE</span><em>what the EQ does, 20 Hz – 20 kHz</em></div>
      <svg class="curve" viewBox="0 0 360 78" data-curve></svg>
    </div>
  </template>

  <!-- Physics P2: response curve + stage A/B pills -->
  <template id="phys-p2">
    <div class="phys">
      <div class="hdr"><span>RESPONSE</span><em>tap a stage to A/B it</em></div>
      <svg class="curve" viewBox="0 0 360 78" data-curve></svg>
      <div class="stages">
        <span class="stage fixed">In</span><span class="stage on">HPF ●</span><span class="stage on">EQ ●</span><span class="stage">Comp ○</span><span class="stage on">Gain ●</span><span class="stage fixed">Out</span>
      </div>
    </div>
  </template>

  <!-- Physics P3: animated signal wave + response curve -->
  <template id="phys-p3">
    <div class="phys">
      <div class="hdr"><span>SIGNAL</span><em>animated model of your settings</em></div>
      <svg class="wave" viewBox="0 0 360 54" data-wave></svg>
      <div class="hdr"><span>RESPONSE</span><em>20 Hz – 20 kHz</em></div>
      <svg class="curve" viewBox="0 0 360 78" data-curve></svg>
    </div>
  </template>

  <template id="rows">
    <div class="eqrow" data-row="bass"><div class="label">Bass Boost</div><span class="nudge">−</span><div class="track"><i style="left:36%"></i></div><span class="nudge">+</span><span class="val">+5.0 dB</span></div>
    <div class="eqrow" data-row="hpf"><div class="label">HPF <small>anti-distort</small></div><span class="nudge">−</span><div class="track"><i style="left:6%"></i></div><span class="nudge">+</span><span class="val">30 Hz</span></div>
    <div class="eqrow" data-row="mid"><div class="label">Mid <small>vocals / body</small></div><span class="nudge">−</span><div class="track"><i style="left:62%"></i></div><span class="nudge">+</span><span class="val">+1.5 dB</span></div>
    <div class="eqrow" data-row="high"><div class="label">High <small>sparkle</small></div><span class="nudge">−</span><div class="track"><i style="left:67%"></i></div><span class="nudge">+</span><span class="val">+2.0 dB</span></div>
    <div class="eqrow toggle" data-row="auto"><div class="label">Auto-Balancing <small>leveler</small></div><label class="switch"><input type="checkbox" checked><span class="knob"></span></label></div>
    <div class="eqrow" data-row="vol"><div class="label">Master Volume</div><span class="nudge">−</span><div class="track"><i style="left:25%"></i></div><span class="nudge">+</span><span class="val">100%</span></div>
    <div class="eqrow" data-row="speed"><div class="label">Pitch / Speed</div><span class="nudge">−</span><div class="track"><i style="left:45%"></i></div><span class="nudge">+</span><span class="val">1.00x</span></div>
  </template>

  <!-- footer: Stay open · theme dots · Mini bar -->
  <template id="foot">
    <div class="foot">
      <div class="opt"><label class="switch"><input type="checkbox"><span class="knob"></span></label><b>Stay open</b></div>
      <div class="dots" title="Theme"><i class="sel" style="background:#00e5ff"></i><i style="background:#ff9d00"></i><i style="background:#ff007f"></i><i style="background:#00ff66"></i><i style="background:#b388ff"></i></div>
      <span class="link">Mini bar ▣</span>
    </div>
  </template>

  <template id="micro">
    <div class="micro shot-micro">
      <div class="mart"></div>
      <div class="mtext">
        <div class="title">Innerbloom (What So Not Remix)</div>
        <div class="artist">RÜFÜS DU SOL · 2015</div>
      </div>
      <button class="tbtn heart"><svg><use href="#s-heart"/></svg></button>
      <button class="tbtn jump"><svg><use href="#s-back"/></svg><span>15</span></button>
      <button class="tbtn play"><svg><use href="#s-pause"/></svg></button>
      <button class="tbtn jump"><svg><use href="#s-fwd"/></svg><span>30</span></button>
      <span class="eqpill">● EQ</span>
      <span class="x">✕</span>
    </div>
  </template>

  <script>
    const ICONS = { bass: 'i-bass', hpf: 'i-hpf', mid: 'i-mid', high: 'i-high', auto: 'i-auto', vol: 'i-vol', speed: 'i-speed' };
    const TAGS = { bass: 'LOW', hpf: 'HPF', mid: 'MID', high: 'HI', auto: 'AUTO', vol: 'VOL', speed: 'SPD' };
    const ACTIVE = new Set(['bass', 'mid', 'high', 'auto']); // rows away from neutral in this example
    const VARIANTS = {
      c2: { player: 'player-c2', phys: 'phys-p1', icons: 'none', caption: 'Player C2 (recommended): title line, then a transport row: ♥ · prev · back 15 s · play/pause · forward 30 s · next. Physics P1 built in. Legible size (440 px, 12.5 px text).' },
      c1: { player: 'player-c1', phys: 'phys-p1', icons: 'none', caption: 'Player C1: ♥ · back 15 s · play/pause · forward 30 s on the title line (no prev/next). Shorter, but long titles get cut sooner.' },
      p1: { player: 'player-c2', phys: 'phys-p1', icons: 'none', caption: 'Physics P1: the response curve lives on the main screen, above the sliders, and redraws as you move them. No animation, no toggle.' },
      p2: { player: 'player-c2', phys: 'phys-p2', icons: 'none', caption: 'Physics P2 (recommended): the curve plus the stage A/B pills (HPF · EQ · Comp · Gain), so you can bypass a stage without leaving the screen.' },
      p3: { player: 'player-c2', phys: 'phys-p3', icons: 'none', caption: 'Physics P3: the animated signal wave and the curve, both on the main screen. Tallest option.' },
      i2: { player: 'player-c2', phys: 'phys-p1', icons: 'line', caption: 'Icons option 2: thin line icons, grey at neutral and accent-coloured when the row is active.' },
      i3: { player: 'player-c2', phys: 'phys-p1', icons: 'tag', caption: 'Icons option 3: small tags (LOW / HPF / MID / HI / AUTO / VOL / SPD) instead of pictures.' },
      micro: { micro: true, caption: 'Always-on-top mini bar (Document Picture-in-Picture): floats over every app. Art · title · ♥ · −15 s · play · +30 s · EQ pill · close.' }
    };
    const params = new URLSearchParams(location.search);
    const v = VARIANTS[params.get('variant')] ? params.get('variant') : 'c2';
    const V = VARIANTS[v];
    const root = document.getElementById('root');
    const tpl = (id) => document.getElementById(id).content.cloneNode(true);

    // Smooth curve through points (Catmull-Rom → cubic Bézier).
    function smoothPath(pts) {
      let d = `M${pts[0][0]},${pts[0][1]}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
      }
      return d;
    }
    function drawCurve(svg) {
      const zero = 44;                       // 0 dB line; 1 dB ≈ 2 px (±16 dB visible)
      const pts = [[0, zero + 30], [18, zero + 12], [36, zero - 4], [58, zero - 10], [84, zero - 8], [120, zero - 2], [160, zero - 3.5], [200, zero - 1.5], [240, zero - 3], [290, zero - 4.5], [360, zero - 4.5]];
      const d = smoothPath(pts);
      const freqs = [[0, '20 Hz'], [63, '60'], [132, '200'], [216, '1k'], [300, '5k'], [352, '20k']];
      svg.innerHTML = `
        <line x1="0" y1="${zero}" x2="360" y2="${zero}"/>
        ${freqs.map(([x]) => `<line x1="${x}" y1="6" x2="${x}" y2="66" style="stroke:rgba(255,255,255,0.05)"/>`).join('')}
        <path class="fill" d="${d} L360,${zero} L0,${zero} Z"/>
        <path class="c" d="${d}"/>
        ${freqs.map(([x, l]) => `<text x="${Math.min(x, 342)}" y="75">${l}</text>`).join('')}
        <text x="4" y="${zero - 4}" style="fill:#555">0 dB</text>`;
    }
    function drawWave(svg) {
      const pts = [];
      for (let x = 0; x <= 360; x += 4) {
        const stage = Math.floor(x / 60);
        const amp = [9, 8, 14, 12, 12, 13][stage];
        pts.push([x, 27 + Math.sin(x / 11) * amp + Math.sin(x / 4.5) * amp * 0.3]);
      }
      svg.innerHTML = `
        ${[60, 120, 180, 240, 300].map((x) => `<line x1="${x}" y1="0" x2="${x}" y2="54"/>`).join('')}
        <path d="${smoothPath(pts)}"/>
        ${['In', 'HPF', 'EQ', 'Comp', 'Gain', 'Out'].map((l, i) => `<text x="${i * 60 + 4}" y="10">${l}</text>`).join('')}`;
    }

    if (V.micro) {
      root.appendChild(tpl('micro'));
    } else {
      const shot = document.createElement('div'); shot.className = 'shot';
      const row = document.createElement('div'); row.className = 'row';
      const art = document.createElement('div'); art.className = 'art'; art.innerHTML = '<div class="bg"></div><div class="cover" title="Album cover (placeholder)"></div>';
      const col = document.createElement('div'); col.className = 'col';
      col.appendChild(tpl(V.player)); col.appendChild(tpl('status'));
      const eq = document.createElement('div'); eq.className = 'eq';
      eq.appendChild(tpl('presets')); eq.appendChild(tpl(V.phys)); eq.appendChild(tpl('rows'));
      col.appendChild(eq); col.appendChild(tpl('foot'));
      row.append(art, col); shot.appendChild(row);
      root.appendChild(shot);
      shot.querySelectorAll('svg[data-curve]').forEach(drawCurve);
      shot.querySelectorAll('svg[data-wave]').forEach(drawWave);
      if (V.icons !== 'none') {
        shot.querySelectorAll('.eqrow').forEach((r) => {
          const key = r.dataset.row; const label = r.querySelector('.label');
          if (V.icons === 'line') {
            const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'ic' + (ACTIVE.has(key) ? ' on' : ''));
            s.innerHTML = `<use href="#${ICONS[key]}"/>`; label.prepend(s);
          } else {
            const t = document.createElement('span'); t.className = 'tag' + (ACTIVE.has(key) ? ' on' : ''); t.textContent = TAGS[key]; label.prepend(t);
          }
        });
      }
    }
    document.getElementById('caption').textContent = V.caption;
    const sw = document.getElementById('switcher');
    if (params.get('shot')) { sw.remove(); document.getElementById('caption').remove(); }
    else sw.innerHTML = 'Variant: ' + Object.keys(VARIANTS).map((k) => `<a class="${k === v ? 'on' : ''}" href="?variant=${k}">${k.toUpperCase()}</a>`).join(' ');
  </script>
</body>
</html>
