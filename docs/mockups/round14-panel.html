<!-- Round 14 mockup fragment for tools/panelshot.mjs: injected into the real side-panel page of a scratch build.
     Variants: today (no change), a (cover on top), b (album and artist at the bottom), c (both).
     Data: the track is the one from the click report; album and artist facts are real MusicBrainz data read on
     2026-10-11 (release group e05203e6 "Glassworks", artist 5ae54dee "Philip Glass"); the cover is the harness's
     synthetic placeholder, not the real artwork. -->
<style>
  /* (a) The cover is the top row, full width; title, artist and transport sit below it. */
  body.panel.mock-cover-top .np {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "cover" "title" "artist" "transport" "progress";
    row-gap: 0;
    padding-top: 12px;
  }
  body.panel.mock-cover-top .np-main { display: contents; }
  body.panel.mock-cover-top .np-cover {
    grid-area: cover; width: 100%; height: auto; aspect-ratio: 1 / 1; justify-self: stretch;
    margin-bottom: 10px; border-radius: 6px;
  }
  body.panel.mock-cover-top .np-title { grid-area: title; font-size: 17px; white-space: normal; }
  body.panel.mock-cover-top .np-artist { grid-area: artist; white-space: normal; }
  body.panel.mock-cover-top .transport { grid-area: transport; }
  body.panel.mock-cover-top .progress { grid-area: progress; }

  /* (b) Album and artist cards under the controls, above the footer. Text at 12.5 px or larger. */
  .mock-ctx { display: flex; flex-direction: column; gap: 10px; padding: 4px 12px 12px; }
  .mock-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 9px 10px 10px; }
  .mock-hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .mock-src { font-size: 11px; color: var(--text-muted); }
  .mock-album { font-size: 16px; font-weight: 700; color: var(--text-main); }
  .mock-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .mock-tracks { list-style: none; margin: 8px 0 0; padding: 0; }
  .mock-tracks li { position: relative; display: grid; grid-template-columns: 22px 1fr auto; align-items: center;
    font-size: 13.5px; line-height: 1.25; padding: 5px 6px; border-radius: 5px; color: #d6d6dc; }
  .mock-tracks .n { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .mock-tracks .d { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .mock-tracks li.now { background: rgba(255, 255, 255, 0.06); color: var(--accent); font-weight: 700; }
  .mock-tracks li.now .d { color: var(--accent); }
  .mock-tracks li.now svg { width: 12px; height: 12px; fill: var(--accent); stroke: none; display: block; }
  .mock-tracks li.now i { position: absolute; left: 6px; bottom: 1px; height: 2px; background: var(--accent); border-radius: 1px; }
  .mock-note { font-size: 11.5px; color: var(--text-muted); margin-top: 7px; line-height: 1.35; }
  .mock-chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 4px; }
  .mock-chips span { font-size: 12.5px; padding: 3px 9px; border-radius: 11px; border: 1px solid var(--border-color); color: var(--text-muted); }
  .mock-chips span.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .mock-gauge { display: block; width: 100%; margin-top: 8px; overflow: visible; }
  .mock-sel { font-size: 13px; margin-top: 4px; color: var(--text-main); }
  .mock-sel b { color: var(--accent); }
</style>

  const NAMES = ['Albums', 'Soundtracks', 'Live & compilations', 'Singles & EPs'];

  const W = svg.clientWidth, LANE = 32, AXIS = 46, H = NAMES.length * LANE + AXIS;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const x = (t) => 2 + (t - START) / (NOW - START) * (W - 4);
  const age = (t) => Math.floor(t - BORN);
  const HALO = 'paint-order="stroke" stroke="#17171c" stroke-width="3" stroke-linejoin="round"';
