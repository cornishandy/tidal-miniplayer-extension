<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Fake Tidal (synthetic test fixture)</title></head>
<body>
  <!-- Decoy: a playlist card play button OUTSIDE the footer. Must never be clicked by transport commands. -->
  <section id="cards">
    <div class="card"><a href="/playlist/11111111-aaaa">A+</a><button data-test="play" id="decoy-play">Play card</button></div>
    <a href="/playlist/22222222-bbbb">Super A+</a>
    <a href="/playlist/33333333-cccc">&lt;b&gt;Bold&lt;/b&gt; &amp; Co</a>
  </section>
  <div id="footerPlayer">
    <img data-test="current-media-imagery" alt="" width="40" height="40" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='30%25' cy='28%25' r='75%25'%3E%3Cstop offset='0' stop-color='%23ffd166'/%3E%3Cstop offset='0.35' stop-color='%23ef476f'/%3E%3Cstop offset='0.7' stop-color='%234b1d6e'/%3E%3Cstop offset='1' stop-color='%230b0b16'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='50' r='18' fill='none' stroke='white' stroke-opacity='0.6' stroke-width='3'/%3E%3C/svg%3E">
    <a data-test="footer-track-title" href="/album/1">Synthetic Tone</a>
    <a data-test="track-artist" href="/artist/1">Test Generator</a>
    <div data-test="playback-controls">
      <button data-test="previous" id="prev">Prev</button>
      <button data-test="play" id="footer-play" aria-label="Play">Play</button>
      <button data-test="next" id="next">Next</button>
    </div>
    <button data-test="footer-favorite" id="fav" aria-checked="false">Fav</button>
    <span data-test="current-time" id="cur">0:00</span>
    <input type="range" data-test="progress-bar" id="bar" min="0" max="100" step="0.1" value="0">
    <span data-test="duration" id="dur">0:00</span>
  </div>
  <!-- Like Tidal, the media element is not reachable with document.querySelector: it lives in a shadow root. -->
  <div id="player-host"></div>
  <script>
    window.clicks = { decoy: 0, footerPlay: 0, prev: 0, next: 0, fav: 0, seek: 0 };
    const root = document.getElementById('player-host').attachShadow({ mode: 'open' });
    const a = document.createElement('audio');
    a.id = 'a'; a.src = '/tone.wav'; a.loop = true;
    root.appendChild(a);
    window.audioEl = a; // for the harness only
    const fmt = (s) => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';
    const cur = document.getElementById('cur'), dur = document.getElementById('dur'), bar = document.getElementById('bar');
    const sync = () => { cur.textContent = fmt(a.currentTime); dur.textContent = fmt(a.duration); if (a.duration) bar.value = (a.currentTime / a.duration * 100).toFixed(1); };
    a.addEventListener('timeupdate', sync); a.addEventListener('loadedmetadata', sync); a.addEventListener('seeked', sync);
    bar.addEventListener('input', () => { if (a.duration) { a.currentTime = bar.value / 100 * a.duration; window.clicks.seek++; } });
    document.getElementById('decoy-play').onclick = () => { window.clicks.decoy++; };
    const fp = document.getElementById('footer-play');
    fp.onclick = () => {
      window.clicks.footerPlay++;
      if (a.paused) { a.play(); fp.setAttribute('data-test', 'pause'); fp.setAttribute('aria-label', 'Pause'); }
      else { a.pause(); fp.setAttribute('data-test', 'play'); fp.setAttribute('aria-label', 'Play'); }
    };
    document.getElementById('prev').onclick = () => { window.clicks.prev++; };
    document.getElementById('next').onclick = () => { window.clicks.next++; };
    const fav = document.getElementById('fav');
    fav.onclick = () => { window.clicks.fav++; fav.setAttribute('aria-checked', String(fav.getAttribute('aria-checked') !== 'true')); };
  </script>
</body></html>
