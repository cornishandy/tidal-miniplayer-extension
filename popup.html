<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tidal DJ Bass Booster</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body>
  <!-- Line icons (no emoji). Referenced with <use href="#…">. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="s-heart" viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9A5.2 5.2 0 0 1 12 6.2 5.2 5.2 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></symbol>
    <symbol id="s-prev" viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M18 5 8 12l10 7z"/></symbol>
    <symbol id="s-next" viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M6 5l10 7-10 7z"/></symbol>
    <symbol id="s-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
    <symbol id="s-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
    <symbol id="s-back" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 3v5h5"/></symbol>
    <symbol id="s-fwd" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v5h-5"/></symbol>
    <!-- band icons (side panel buttons) -->
    <symbol id="i-bass" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="2.2"/></symbol>
    <symbol id="i-hpf" viewBox="0 0 16 16"><path d="M2 13.5C5.5 13.5 6 3 14 3"/><path d="M2 3v10.5"/></symbol>
    <symbol id="i-mid" viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5"/></symbol>
    <symbol id="i-high" viewBox="0 0 16 16"><path d="M8 1.5 9.6 6.4 14.5 8 9.6 9.6 8 14.5 6.4 9.6 1.5 8l4.9-1.6z"/></symbol>
    <symbol id="i-comp" viewBox="0 0 16 16"><path d="M8 2v12M3 5.5h10"/><path d="M3 5.5 1.5 10h3zM13 5.5l-1.5 4.5h3z"/></symbol>
    <symbol id="i-gain" viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.5 6a3 3 0 0 1 0 4"/></symbol>
    <symbol id="i-pitch" viewBox="0 0 16 16"><path d="M6 12.5V3.5l7-2V11"/><circle cx="4" cy="12.5" r="2"/><circle cx="11" cy="11" r="2"/></symbol>
  </svg>

  <div class="popup-container">
    <!-- Cover art: a centre slice of the full cover runs down the left edge -->
    <aside class="art-strip" id="art-strip">
      <img class="art-slice" id="art-slice" alt="" hidden>
    </aside>

    <div class="popup-main">
      <!-- Now playing + transport, with the full cover on the right -->
      <section class="np">
        <div class="np-main">
        <div class="np-title" id="player-title">Connecting…</div>
        <div class="np-artist"><b id="player-artist">Media tab</b><span id="player-meta"></span></div>
        <div class="transport">
          <button id="player-btn-fav" class="tbtn heart" title="Add to / remove from My Collection"><svg><use href="#s-heart"/></svg></button>
          <button id="player-btn-prev" class="tbtn small" title="Previous track"><svg><use href="#s-prev"/></svg></button>
          <button id="player-btn-back15" class="tbtn jump" title="Back 15 seconds"><svg><use href="#s-back"/></svg><span>15</span></button>
          <button id="player-btn-play" class="tbtn play" title="Play / Pause"><svg><use id="play-icon" href="#s-play"/></svg></button>
          <button id="player-btn-fwd30" class="tbtn jump" title="Forward 30 seconds"><svg><use href="#s-fwd"/></svg><span>30</span></button>
          <button id="player-btn-next" class="tbtn small" title="Next track"><svg><use href="#s-next"/></svg></button>
        </div>
        </div>
        <img class="np-cover" id="art-cover" alt="" hidden>
        <div class="progress"><div id="player-progress-fill"></div></div>
      </section>

      <!-- Master EQ switch -->
      <section class="status-bar">
        <span class="power-title">AUDIO EQ</span>
        <label class="switch power-switch" title="Turn the EQ on or off for the tab you opened this on">
          <input type="checkbox" id="toggle-eq-power" aria-label="Audio EQ">
          <span class="slider-round"></span>
        </label>
        <span id="eq-power-status-badge" class="power-badge off">○ OFF</span>
      </section>

      <section class="eq-pane">
        <!-- Presets -->
        <div class="preset-section">
          <div class="section-title-row">
            <div class="section-title-group">
              <label for="preset-select" class="section-title">PRESETS</label>
              <span id="preset-status-badge" class="preset-badge-saved">● Saved</span>
            </div>
            <div class="preset-actions">
              <button id="btn-update-preset" class="btn-text" title="Save the current values into this custom preset" style="display:none;">Update</button>
              <button id="btn-save-preset" class="btn-text" title="Save the current values as a new preset">+ Save</button>
              <button id="btn-delete-preset" class="btn-text btn-danger" title="Delete this custom preset" style="display:none;">✕</button>
              <button id="btn-reset-defaults" class="btn-text" title="Restore this preset's saved values (factory values for a default preset)">↺ Reset</button>
            </div>
          </div>
          <select id="preset-select" class="preset-dropdown"></select>
        </div>

        <!-- Physics: the live spectrum of the processed audio (grey = in, colour = out) and the settings' response curve -->
        <div class="physics">
          <div class="phys-hdr"><span>PHYSICS</span><em id="physics-readout" title="Top: live spectrum of the audio while the EQ is on (grey = what the tab sends, colour = what you hear). Bottom: the response your settings make."></em></div>
          <canvas id="live-canvas" class="phys-canvas live" role="img" aria-label="Live spectrum of the audio: grey is what the tab sends, colour is what you hear"></canvas>
          <canvas id="bode-canvas" class="phys-canvas bode" role="img" aria-label="Frequency response of the current settings"></canvas>
        </div>

        <!-- Sliders. The tag at the left switches that stage off while keeping its value. -->
        <main class="controls-area">
          <div class="eq-row" data-band="bass">
            <button class="band-tag" aria-pressed="true" data-band="bass" title="Bass on. Click to switch it off without losing the value."><svg class="band-icon" aria-hidden="true"><use href="#i-bass"/></svg><span class="band-text">LOW</span></button>
            <div class="eq-label" title="Low-shelf filter at 120 Hz: warm low-end weight, +0 to +14 dB.">Bass Boost</div>
            <button class="eq-nudge-btn" data-action="down" data-target="slider-bass" data-step="0.5" title="−0.5 dB (Shift: −0.1)">−</button>
            <input type="range" id="slider-bass" class="eq-slider" aria-label="Bass Boost, dB" min="0" max="14" step="0.5" value="5.0">
            <button class="eq-nudge-btn" data-action="up" data-target="slider-bass" data-step="0.5" title="+0.5 dB (Shift: +0.1)">+</button>
            <span class="eq-val" id="val-bass" title="Double-click: neutral / restore">+5.0 dB</span>
          </div>

          <div class="eq-row" data-band="hpf">
            <button class="band-tag" aria-pressed="true" data-band="hpf" title="High-pass filter on. Click to switch it off without losing the value."><svg class="band-icon" aria-hidden="true"><use href="#i-hpf"/></svg><span class="band-text">HPF</span></button>
            <div class="eq-label" title="High-pass filter, 20 to 200 Hz, 12 dB/octave: removes sub-sonic rumble that causes distortion.">HPF <small>anti-distort</small></div>
            <button class="eq-nudge-btn" data-action="down" data-target="slider-hpf" data-step="5" title="−5 Hz (Shift: −1)">−</button>
            <input type="range" id="slider-hpf" class="eq-slider" aria-label="High-pass filter, Hz" min="20" max="200" step="5" value="30">
            <button class="eq-nudge-btn" data-action="up" data-target="slider-hpf" data-step="5" title="+5 Hz (Shift: +1)">+</button>
            <span class="eq-val" id="val-hpf" title="Double-click: neutral / restore">30 Hz</span>
          </div>

          <div class="eq-row" data-band="mid">
            <button class="band-tag" aria-pressed="true" data-band="mid" title="Mid on. Click to switch it off without losing the value."><svg class="band-icon" aria-hidden="true"><use href="#i-mid"/></svg><span class="band-text">MID</span></button>
            <div class="eq-label" title="Peaking filter at 1 kHz (Q 0.8): vocal presence and body, −6 to +6 dB.">Mid <small>vocals / body</small></div>
            <button class="eq-nudge-btn" data-action="down" data-target="slider-mid" data-step="0.5" title="−0.5 dB (Shift: −0.1)">−</button>
            <input type="range" id="slider-mid" class="eq-slider" aria-label="Mid, dB" min="-6" max="6" step="0.5" value="1.5">
            <button class="eq-nudge-btn" data-action="up" data-target="slider-mid" data-step="0.5" title="+0.5 dB (Shift: +0.1)">+</button>
            <span class="eq-val" id="val-mid" title="Double-click: neutral / restore">+1.5 dB</span>
          </div>

          <div class="eq-row" data-band="high">
            <button class="band-tag" aria-pressed="true" data-band="high" title="High on. Click to switch it off without losing the value."><svg class="band-icon" aria-hidden="true"><use href="#i-high"/></svg><span class="band-text">HI</span></button>
            <div class="eq-label" title="High-shelf filter at 5 kHz: air and sparkle, −6 to +6 dB.">High <small>sparkle</small></div>
            <button class="eq-nudge-btn" data-action="down" data-target="slider-high" data-step="0.5" title="−0.5 dB (Shift: −0.1)">−</button>
            <input type="range" id="slider-high" class="eq-slider" aria-label="High, dB" min="-6" max="6" step="0.5" value="2.0">
            <button class="eq-nudge-btn" data-action="up" data-target="slider-high" data-step="0.5" title="+0.5 dB (Shift: +0.1)">+</button>
            <span class="eq-val" id="val-high" title="Double-click: neutral / restore">+2.0 dB</span>
          </div>

          <div class="eq-row toggle-row" data-band="comp">
            <button class="band-tag" aria-pressed="true" data-band="comp" title="Auto-Balancing on. Click to switch it off."><svg class="band-icon" aria-hidden="true"><use href="#i-comp"/></svg><span class="band-text">AUTO</span></button>
            <div class="eq-label" title="Dynamic leveler: keeps deep bass boosts balanced and free of distortion.">Auto-Balancing <small>leveler</small></div>
            <span class="eq-val" id="val-auto">on</span>
          </div>

          <div class="eq-row" data-band="gain">
            <button class="band-tag" aria-pressed="true" data-band="gain" title="Master volume on. Click to switch it off (100 %) without losing the value."><svg class="band-icon" aria-hidden="true"><use href="#i-gain"/></svg><span class="band-text">VOL</span></button>
            <div class="eq-label" title="Output gain, 50 % to 250 %, before the safety limiter. 100 % is unity.">Master Volume</div>
            <button class="eq-nudge-btn" data-action="down" data-target="slider-gain" data-step="0.05" title="−5 % (Shift: −1 %)">−</button>
            <input type="range" id="slider-gain" class="eq-slider" aria-label="Master Volume, percent" min="0.5" max="2.5" step="0.05" value="1.0">
            <button class="eq-nudge-btn" data-action="up" data-target="slider-gain" data-step="0.05" title="+5 % (Shift: +1 %)">+</button>
            <span class="eq-val" id="val-gain" title="Double-click: neutral / restore">100%</span>
          </div>

          <div class="eq-row" data-band="pitch">
            <button class="band-tag" aria-pressed="true" data-band="pitch" title="Pitch on. Click to switch it off (0 st) without losing the value."><svg class="band-icon" aria-hidden="true"><use href="#i-pitch"/></svg><span class="band-text">PITCH</span></button>
            <div class="eq-label" title="Key shift, −12 to +12 semitones: the pitch moves, the speed stays the same. Clean within a few semitones; further out, long notes warble a little. Applies while the EQ is on.">Pitch <small>key, same speed</small></div>
            <button class="eq-nudge-btn" data-action="down" data-target="slider-pitch" data-step="0.5" title="−0.5 semitone (Shift: −0.1)">−</button>
            <input type="range" id="slider-pitch" class="eq-slider" aria-label="Pitch, semitones" min="-12" max="12" step="0.1" value="0">
            <button class="eq-nudge-btn" data-action="up" data-target="slider-pitch" data-step="0.5" title="+0.5 semitone (Shift: +0.1)">+</button>
            <span class="eq-val" id="val-pitch" title="Double-click: neutral / restore">0.0 st</span>
          </div>
        </main>
      </section>

      <!-- Footer: the only controls that are not EQ -->
      <footer class="foot">
        <label class="opt" title="On: this screen docks into Chrome's side panel beside the page and stays there while you click anything; the toolbar icon opens it. Off: the normal popup, which Chrome closes when you click elsewhere.">
          <span class="switch"><input type="checkbox" id="toggle-stay-open"><span class="slider-round"></span></span>
          <b>Stay open</b>
        </label>
        <div class="dots" id="theme-dots" title="Theme">
          <button class="dot" aria-pressed="false" data-theme="theme-cyan" style="background:#00e5ff" title="Cyan"></button>
          <button class="dot" aria-pressed="false" data-theme="theme-amber" style="background:#ff9d00" title="Amber"></button>
          <button class="dot" aria-pressed="false" data-theme="theme-synthwave" style="background:#ff007f" title="Synthwave"></button>
          <button class="dot" aria-pressed="false" data-theme="theme-matrix" style="background:#00ff66" title="Matrix"></button>
          <button class="dot" aria-pressed="false" data-theme="theme-oled" style="background:#b388ff" title="OLED"></button>
        </div>
        <button id="btn-minibar" class="link" title="Float a small always-on-top bar over every app (opens from the side panel or the window)">Mini bar ▣</button>
      </footer>
      <div class="hint" id="hint" role="status" aria-live="polite" hidden></div>
    </div>
  </div>

  <script src="physics-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
